services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: saasdelivery_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DB_HOST: db
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
    ports:
      # Portas HTTP e HTTPS públicas
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      # Projeto servido diretamente na raiz (Document Root /)
      - ./:/var/www/vhosts/localhost/html
      # Certificados SSL Cloudflare Origin
      - ./certs:/usr/local/lsws/conf/certs:ro

  db:
    image: mariadb:10.11
    container_name: saasdelivery_db
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=256M # Ajuste para evitar estouro de memória (OOM) na Lightsail
      - --max-connections=60
    # Blindagem de Segurança (AWS):
    # Não expõe porta para a internet (0.0.0.0). Para acesso administrativo remoto (DBeaver/HeidiSQL),
    # utilize um túnel SSH na instância da Lightsail ou descomente a linha abaixo vinculando apenas ao localhost:
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Importado automaticamente apenas na PRIMEIRA subida (volume vazio)
      - ./banco_producao_aws.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # phpMyAdmin blindado: protegido por Profile (não sobe por padrão em produção)
  # Para iniciar sob demanda: docker compose --profile tools up -d phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saasdelivery_pma
    restart: unless-stopped
    profiles:
      - tools
    ports:
      # Acessível exclusivamente em loopback (túnel SSH: ssh -L 8081:localhost:8081 user@ip-lightsail)
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
