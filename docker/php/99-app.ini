; =====================================================================
; Configurações PHP 8.3 para Produção (AWS Lightsail)
; =====================================================================

; Fuso horário e limites de recursos
date.timezone = America/Sao_Paulo
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 180
max_input_vars = 5000
default_charset = "UTF-8"

; Segurança e Ofuscação de Ambiente
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Segurança de Sessão (Proteção contra XSS e Fixação de Sessão)
session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1

; Otimização de Performance (OPcache)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
