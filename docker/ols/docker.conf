allowSymbolLink           1
enableScript              1
restrained                1
setUIDMode                2
vhRoot                    /var/www/vhosts/$VH_NAME/
configFile                $SERVER_ROOT/conf/vhosts/$VH_NAME/vhconf.conf

virtualHostConfig  {
  docRoot                 $VH_ROOT/html/
  enableGzip              1
  enableBr                1

  errorlog  {
    useServer             1
  }

  accesslog $SERVER_ROOT/logs/$VH_NAME.access.log {
    useServer             0
    rollingSize           100M
    keepDays              7
    compressArchive       1
  }

  index  {
    useServer             0
    indexFiles            index.php, index.html
    autoIndex             0
    autoIndexURI          /_autoindex/default.php
  }

  expires  {
    enableExpires         1
  }

  accessControl  {
    allow                 *
  }

  context / {
    location              $DOC_ROOT/
    allowBrowse           1

    rewrite  {
      enable              1
      rules               <<<END_rules
RewriteEngine On
RewriteBase /

# Bloqueia acesso web aos arquivos de infraestrutura Docker, git e dumps SQL
RewriteRule (^|/)\.(env|git) - [F,L]
RewriteRule (^|/)(docker-compose\.yml|docker)(/|$) - [F,L]
RewriteRule \.sql$ - [F,L]

# Se o arquivo ou diretório existir fisicamente, serve diretamente (ex: sistema/, css/, js/, img/)
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d [OR]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
RewriteRule ^ - [L]

# Rotas públicas Multi-tenant baseadas em Slug (ex: /pizzariaaquadrada/carrinho)
RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/carrinho/?$ /carrinho.php?url_empresa=$1 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/finalizar/?$ /finalizar.php?url_empresa=$1 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/index/?$ /site.php?url=$1&url_empresa=$1 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/pedido/([^/]+)/?$ /pedido.php?url_empresa=$1&id=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/pedido-([^/]+)/?$ /pedido.php?url_empresa=$1&id=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/mesa/([^/]+)/?$ /mesa.php?url_empresa=$1&id_mesa=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/mesa-([^/]+)/?$ /mesa.php?url_empresa=$1&id_mesa=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/categoria-sabores-([^/]+)/?$ /pizza.php?url_empresa=$1&url=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/categoria-([^/]+)/?$ /itens.php?url_empresa=$1&url=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/produto-([^/]+)/?$ /pizza.php?url_empresa=$1&url=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/adicionais-([^/]+)/?$ /adicionais.php?url_empresa=$1&url=$2 [NC,QSA,L]

RewriteCond %{REQUEST_URI} !^/?(sistema|painel|assets|app_assets|css|js|img|fonts|cron)(/|$) [NC]
RewriteRule ^/?([a-zA-Z0-9_-]+)/observacoes-([^/]+)/?$ /observacoes.php?url_empresa=$1&url=$2 [NC,QSA,L]

# Rotas amigáveis da aplicação na raiz (/)
RewriteRule ^/?carrinho/?$ /carrinho.php [NC,QSA,L]
RewriteRule ^/?finalizar/?$ /finalizar.php [NC,QSA,L]
RewriteRule ^/?login/?$ /sistema/index.php [NC,QSA,L]
RewriteRule ^/?pedido/([^/]+)/?$ /pedido.php?id=$1 [NC,QSA,L]
RewriteRule ^/?pedido-([^/]+)/?$ /pedido.php?id=$1 [NC,QSA,L]
RewriteRule ^/?mesa/([^/]+)/?$ /mesa.php?id_mesa=$1 [NC,QSA,L]
RewriteRule ^/?mesa-([^/]+)/?$ /mesa.php?id_mesa=$1 [NC,QSA,L]
RewriteRule ^/?pagamento/([^/]+)/?$ /sistema/sas/pagamentos/index.php?id_conta=$1 [NC,QSA,L]
RewriteRule ^/?pagamento_plano/([^/]+)/?$ /sistema/sas/pagamentos/index.php?id_conta=$1 [NC,QSA,L]
RewriteRule ^/?pagamento_plano_asaas/([^/]+)/?$ /sistema/sas/asaas/index.php?id_conta=$1 [NC,QSA,L]
RewriteRule ^/?categoria-sabores-([^/]+)/?$ /pizza.php?url=$1 [NC,QSA,L]
RewriteRule ^/?categoria-([^/]+)/?$ /itens.php?url=$1 [NC,QSA,L]
RewriteRule ^/?produto-([^/]+)/?$ /pizza.php?url=$1 [NC,QSA,L]
RewriteRule ^/?adicionais-([^/]+)/?$ /adicionais.php?url=$1 [NC,QSA,L]
RewriteRule ^/?observacoes-([^/]+)/?$ /observacoes.php?url=$1 [NC,QSA,L]

# Regra coringa para slugs dinâmicos das empresas na raiz (ex: /pizzariaaquadrada)
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^/?([^/]+)/?$ /site.php?url=$1&url_empresa=$1 [NC,QSA,L]
      END_rules
    }
    addDefaultCharset     off
  }

