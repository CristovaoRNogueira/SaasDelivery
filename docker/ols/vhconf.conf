docRoot                   $VH_ROOT/html/
enableGzip                1
enableBr                  1

index  {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog  {
  useServer               1
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1

  rewrite  {
    enable                1
    RewriteFile           .htaccess
    rules                 <<<END_rules
RewriteEngine On
RewriteBase /

# Bloqueia acesso web aos arquivos de infraestrutura Docker, git e dumps SQL
RewriteRule (^|/)\.(env|git) - [F,L]
RewriteRule (^|/)(docker-compose\.yml|docker)(/|$) - [F,L]
RewriteRule \.sql$ - [F,L]

# Se o arquivo ou diretório existir fisicamente, serve diretamente (ex: sistema/, css/, js/, img/)
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# Rotas amigáveis da aplicação na raiz (/)
RewriteRule ^carrinho/?$ carrinho.php [QSA,L]
RewriteRule ^finalizar/?$ finalizar.php [QSA,L]
RewriteRule ^login/?$ sistema/index.php [QSA,L]
RewriteRule ^pedido/([^/]+)/?$ pedido.php?id=$1 [QSA,L]
RewriteRule ^pedido-([^/]+)/?$ pedido.php?id=$1 [QSA,L]
RewriteRule ^mesa/([^/]+)/?$ mesa.php?id_mesa=$1 [QSA,L]
RewriteRule ^mesa-([^/]+)/?$ mesa.php?id_mesa=$1 [QSA,L]
RewriteRule ^pagamento/([^/]+)/?$ sistema/sas/pagamentos/index.php?id_conta=$1 [QSA,L]
RewriteRule ^pagamento_plano/([^/]+)/?$ sistema/sas/pagamentos/index.php?id_conta=$1 [QSA,L]
RewriteRule ^pagamento_plano_asaas/([^/]+)/?$ sistema/sas/asaas/index.php?id_conta=$1 [QSA,L]
RewriteRule ^categoria-sabores-([^/]+)/?$ itens.php?url=$1 [QSA,L]
RewriteRule ^categoria-([^/]+)/?$ itens.php?url=$1 [QSA,L]
RewriteRule ^produto-([^/]+)/?$ pizza.php?url=$1 [QSA,L]
RewriteRule ^adicionais-([^/]+)/?$ adicionais.php?url=$1 [QSA,L]
RewriteRule ^observacoes-([^/]+)/?$ observacoes.php?url=$1 [QSA,L]

# Rota para slugs de empresas cadastradas na raiz (ex: /pizzariaaquadrada)
RewriteRule ^([a-zA-Z0-9_-]+)/?$ site.php?url=$1 [QSA,L]
    END_rules
  }
  addDefaultCharset       off
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  logLevel                0
}
